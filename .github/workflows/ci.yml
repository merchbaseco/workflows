name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test scripts/*.test.mjs

  published-package-bump:
    name: Bump guard smoke
    uses: ./.github/workflows/published-package-bump.yml
    with:
      published_packages: scripts/fixtures/sample-package:@merchbaseco/workflows-bump-guard-fixture
